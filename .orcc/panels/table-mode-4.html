<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--muted:#8a8a86;--sq:#9a9a96;--surface:#fff;--line:#e2e2de;--accent:#1a1a1a;--on-accent:#fff;--hi:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff}}
:root[data-theme=dark],.dark{--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.out{background:var(--sq);border-radius:2px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50}
.bar button{padding:7px 15px;border-radius:999px;color:var(--muted)}
.bar button.on{background:var(--accent);color:var(--on-accent)}
.hint{position:fixed;top:14px;left:16px;color:var(--muted);font-size:12px;z-index:50}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,6px);background:var(--accent);color:var(--on-accent);padding:7px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* D · Grouped */
.wrap{position:absolute;inset:0;overflow:auto;padding:0 24px 104px}
.inner{max-width:880px;margin:0 auto}
.tools{position:sticky;top:0;z-index:3;display:flex;gap:6px;align-items:center;padding:16px 0 10px;background:var(--bg);color:var(--muted);flex-wrap:wrap}
.tools .lab{margin-right:4px}.tools .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{padding:4px 11px;border-radius:999px;color:var(--muted)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.link{color:var(--muted);padding:4px 6px}.link:hover{color:var(--fg)}
button:focus-visible,.item:focus-visible{outline:2px solid var(--hi);outline-offset:2px;border-radius:6px}
.group{margin-top:10px}
.gh{position:sticky;top:56px;z-index:2;display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;background:var(--bg);border-bottom:1px solid var(--line);text-align:left}
.gh .tw{width:10px;color:var(--muted);transition:transform .15s;font-size:10px}
.group.closed .gh .tw{transform:rotate(-90deg)}
.gh .t{font-weight:600}
.gh .n{color:var(--muted);font-variant-numeric:tabular-nums}
.gh .strip{flex:1;display:flex;gap:3px;justify-content:flex-end;min-width:0;overflow:hidden}
.gh .strip span{flex:0 0 14px;height:14px;display:flex;align-items:center;justify-content:center}
.gh .avg{color:var(--muted);font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px 16px;padding:6px 0 4px}
.group.closed .items{display:none}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--surface)}
.item.sel{background:color-mix(in srgb,var(--hi) 12%,transparent);box-shadow:inset 0 0 0 1px var(--hi)}
.item .th{grid-row:span 2;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.item:hover .th{background:var(--bg)}
.item .l1{font-weight:500}
.item .l1,.item .l2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l2{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.by-score .item .r .dots{display:none}
.item .r{grid-row:span 2;text-align:right;color:var(--muted);font-size:12px}
.dots{letter-spacing:1px;font-size:10px;color:var(--fg)}.dots s{text-decoration:none;opacity:.22}
.item .go{display:block;opacity:0;margin-top:2px}
.item:hover .go,.item:focus-visible .go{opacity:1}
@media(max-width:640px){
 .wrap{padding:0 16px 104px}
 .gh .strip{display:none}.gh .avg{margin-left:auto}
 .items{grid-template-columns:1fr}
 .item .go{display:none}
}
</style></head><body>
<div class="wrap"><div class="inner"><div class="tools" id="tools"><span class="lab">Group by</span><span class="seg" id="seg"><button data-g="day" class="on">Day</button><button data-g="score">Score</button><button data-g="size">Size</button></span><span class="sp"></span><button class="link" id="fold">Collapse all</button></div><div id="groups"></div></div></div>
<div class="toast" id="t" role="status"></div>
<nav class="bar"><button class="">Canvas</button><button class="on">Table</button></nav>
<script>
// note: gen.py's hash only ever returns values in [0,0.5) (signed shifts), so scores never pass 3; this version mixes fully
function hash(x,y,s){let h=((s||0)*2654435761+x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h=Math.imul(h^(h>>>16),2246822519);return((h^(h>>>15))>>>0)/4294967296}
function out(x,y){const seed=Math.floor(hash(x,y,7)*1e6);return{id:x+','+y,seed,size:.55+hash(x,y,1)*.35,shade:.45+hash(x,y,2)*.55,
 created:new Date(Date.UTC(2026,9,1+Math.floor(hash(x,y,3)*11),Math.floor(hash(x,y,4)*24),Math.floor(hash(x,y,5)*60))),score:Math.floor(hash(x,y,6)*5)+1}}
function sq(o,scale){scale=scale||1;return '<div class="out" style="width:'+(o.size*100*scale)+'%;height:'+(o.size*100*scale)+'%;opacity:'+o.shade+'"></div>'}
function fmtDate(d){return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'})}
const T=document.getElementById('t');let tt;
function toast(o){T.textContent='Opening #'+o.seed+' in Focus →';T.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('show'),1400)}

const rows=[];for(let i=0;i<60;i++)rows.push(out(i,i*7+3));
const fmtDay=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
const fmtTime=d=>d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'});
const dots=n=>'<span class="dots" aria-label="'+n+' of 5">'+'●'.repeat(n)+'<s>'+'●'.repeat(5-n)+'</s></span>';
const GROUPS={
 day:{key:o=>o.created.toISOString().slice(0,10),label:(k,list)=>fmtDay(list[0].created),order:(a,b)=>a<b?1:-1,within:(a,b)=>b.created-a.created},
 score:{key:o=>o.score,label:k=>k+' / 5 '+dots(+k),order:(a,b)=>b-a,within:(a,b)=>b.created-a.created},
 size:{key:o=>o.size<.67?'S':o.size<.79?'M':'L',label:k=>({S:'Small · under 0.67',M:'Medium · 0.67–0.79',L:'Large · 0.79 and up'})[k],order:(a,b)=>'LMS'.indexOf(a)-'LMS'.indexOf(b),within:(a,b)=>b.size-a.size}};
let by='day',sel=null;const closed=new Set();
const G=document.getElementById('groups');
function draw(){const g=GROUPS[by],m=new Map();
 rows.forEach(o=>{const k=String(g.key(o));if(!m.has(k))m.set(k,[]);m.get(k).push(o)});
 const keys=[...m.keys()].sort(g.order);
 G.className='by-'+by;G.innerHTML=keys.map(k=>{const list=m.get(k).sort(g.within),avg=list.reduce((s,o)=>s+o.score,0)/list.length;
  return '<section class="group'+(closed.has(by+k)?' closed':'')+'" data-k="'+k+'"><button class="gh" aria-expanded="'+!closed.has(by+k)+'"><span class="tw">▼</span><span class="t">'+g.label(k,list)+'</span><span class="n">'+list.length+'</span><span class="strip" aria-hidden="true">'+list.slice(0,24).map(o=>'<span>'+sq(o)+'</span>').join('')+'</span><span class="avg">avg '+avg.toFixed(1)+'</span></button>'+
  '<div class="items">'+list.map(o=>'<div class="item'+(o.id===sel?' sel':'')+'" tabindex="0" role="button" data-id="'+o.id+'"><div class="th">'+sq(o,.85)+'</div><div class="l1 mono">#'+o.seed+'</div><div class="r">'+dots(o.score)+'<span class="go">Open →</span></div><div class="l2">'+(by==='day'?fmtTime(o.created):fmtDate(o.created))+' · size '+o.size.toFixed(2)+' · shade '+o.shade.toFixed(2)+'</div></div>').join('')+'</div></section>'}).join('');
 document.getElementById('fold').textContent=keys.every(k=>closed.has(by+k))?'Expand all':'Collapse all'}
document.getElementById('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;by=b.dataset.g;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));draw()};
document.getElementById('fold').onclick=()=>{const secs=[...G.querySelectorAll('.group')],all=secs.every(s=>s.classList.contains('closed'));secs.forEach(s=>all?closed.delete(by+s.dataset.k):closed.add(by+s.dataset.k));draw()};
function open(it){sel=it.dataset.id;G.querySelectorAll('.item.sel').forEach(x=>x.classList.remove('sel'));it.classList.add('sel');toast(rows.find(o=>o.id===sel))}
G.onclick=e=>{const h=e.target.closest('.gh');if(h){const s=h.parentNode,id=by+s.dataset.k;closed.has(id)?closed.delete(id):closed.add(id);s.classList.toggle('closed');h.setAttribute('aria-expanded',!s.classList.contains('closed'));
  document.getElementById('fold').textContent=[...G.querySelectorAll('.group')].every(x=>x.classList.contains('closed'))?'Expand all':'Collapse all';return}
 const it=e.target.closest('.item');if(it)open(it)};
G.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('item')){e.preventDefault();open(e.target)}};
draw();
</script></body></html>
