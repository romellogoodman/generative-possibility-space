<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--muted:#8a8a86;--sq:#c9c9c5;--bar:#ffffff;--line:#e2e2de;--accent:#1a1a1a;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--fg:#ededed;--muted:#7b7b78;--sq:#3a3a38;--bar:#1d1d1c;--line:#2c2c2a;--accent:#ededed;--on-accent:#121212}}
:root[data-theme=dark],.dark{--bg:#121212;--fg:#ededed;--muted:#7b7b78;--sq:#3a3a38;--bar:#1d1d1c;--line:#2c2c2a;--accent:#ededed;--on-accent:#121212}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;overflow:hidden}
.stage{position:absolute;inset:0 0 var(--bar-h,0) 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:24px;align-content:start;overflow:hidden}
.sq{aspect-ratio:1;background:var(--sq);border-radius:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:var(--bar);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.bar button{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--muted);position:relative;transition:.15s}
.bar button:hover{background:var(--bg);color:var(--fg)}
.bar button.is-active{background:var(--accent);color:var(--on-accent)}
.bar button span{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);font-size:11px;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--on-accent);white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.bar button.is-active span,.bar button:hover span{opacity:1}

</style></head><body>
<div class="stage"><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div></div>
<nav class="bar"><button data-mode="Grid" class=" is-active" aria-label="Grid"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><span>Grid</span></button><button data-mode="Feed" class="" aria-label="Feed"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="8"/><rect x="5" y="13" width="14" height="8"/></svg><span>Feed</span></button><button data-mode="Canvas" class="" aria-label="Canvas"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="6" height="6"/><rect x="12" y="3" width="5" height="5"/><rect x="11" y="12" width="9" height="8"/><rect x="4" y="14" width="4" height="4"/></svg><span>Canvas</span></button><button data-mode="Stack" class="" aria-label="Stack"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="13" height="13"/><rect x="4" y="8" width="13" height="13"/></svg><span>Stack</span></button><button data-mode="Compare" class="" aria-label="Compare"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14"/><rect x="13" y="5" width="8" height="14"/></svg><span>Compare</span></button></nav>
<script>
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('is-active',x===b));}));
addEventListener('keydown',e=>{const i=+e.key-1;const b=document.querySelectorAll('[data-mode]')[i];if(b)b.click()});
</script></body></html>
