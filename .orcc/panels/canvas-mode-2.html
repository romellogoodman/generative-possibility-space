<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--muted:#8a8a86;--sq:#9a9a96;--surface:#fff;--line:#e2e2de;--accent:#1a1a1a;--on-accent:#fff;--hi:#2f6fed;--sq-lo:#d6d6d2;--sq-hi:#6a6a66;--tray:rgba(0,0,0,.035)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff;--sq-lo:#353533;--sq-hi:#b2b2ad;--tray:rgba(255,255,255,.035)}}
:root[data-theme=dark],.dark{--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff;--sq-lo:#353533;--sq-hi:#b2b2ad;--tray:rgba(255,255,255,.035)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50}
.bar button{padding:7px 15px;border-radius:999px;color:var(--muted)}
.bar button.on{background:var(--accent);color:var(--on-accent)}

.vp{position:fixed;inset:0;overflow:hidden;contain:strict;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.vp.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;--z:1}
.out{position:absolute;display:block;padding:0;border-radius:2px;background:color-mix(in oklab,var(--sq-lo),var(--sq-hi) var(--k));animation:pop .45s cubic-bezier(.2,.8,.3,1.15) both;animation-delay:var(--d,0ms);cursor:pointer}
.vp.dragging .out{cursor:grabbing}
.out:hover,.out:focus-visible{outline:calc(2px / var(--z)) solid var(--hi);outline-offset:calc(3px / var(--z))}
.out.sel{outline:calc(2px / var(--z)) solid var(--hi);outline-offset:calc(3px / var(--z));box-shadow:0 0 0 calc(7px / var(--z)) color-mix(in srgb,var(--hi) 22%,transparent)}
@keyframes pop{from{opacity:0;transform:scale(.82)}}
@media (prefers-reduced-motion:reduce){.out{animation:none}}

.chip{position:fixed;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.hint{top:12px;left:12px;padding:5px 11px;transition:opacity .6s;max-width:calc(100vw - 24px)}
.hint.gone{opacity:0;pointer-events:none}
.hint .touch{display:none}
@media (pointer:coarse),(max-width:560px){.hint .fine{display:none}.hint .touch{display:inline}}
.zoom{right:16px;bottom:24px;display:flex;align-items:center;padding:2px}
.zoom button{width:28px;height:28px;border-radius:999px;color:var(--fg);font-size:15px;line-height:1}
.zoom button:hover{background:var(--line)}
.zoom .lvl{width:auto;min-width:46px;padding:0 6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.zoom{top:12px;bottom:auto;right:12px}.zoom .pm{display:none}.hint{max-width:calc(100vw - 96px)}}

.toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,6px);background:var(--accent);color:var(--on-accent);padding:7px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{font-weight:600}

.out .cap{position:absolute;left:calc(6px / var(--z));bottom:calc(6px / var(--z));padding:calc(3px / var(--z)) calc(5px / var(--z));border-radius:calc(4px / var(--z));background:color-mix(in srgb,var(--surface) 82%,transparent);font:500 calc(10px / var(--z))/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.out .cap i{font-style:normal;color:var(--muted)}
.world.near .cap{opacity:1}
.out:hover,.out:focus-visible,.out.sel{outline-offset:0;z-index:2}
</style></head><body>
<div class="chip hint" id="hint"><span class="fine">Scroll or drag to pan · pinch or ⌘-scroll to zoom · click a square</span><span class="touch">Drag to pan · pinch to zoom · tap a square</span></div>
<div class="vp" id="vp" tabindex="0" aria-label="Infinite canvas of outputs"><div class="world" id="w"></div></div>
<div class="chip zoom" id="zoom"><button class="pm" id="zout" aria-label="Zoom out">−</button><button class="lvl" id="zl" title="Reset zoom">100%</button><button class="pm" id="zin" aria-label="Zoom in">+</button></div>
<div class="toast" id="t" role="status"></div>
<nav class="bar"><button class="on">Canvas</button><button class="">Table</button></nav>
<script>
function hash(x,y,s){let h=Math.imul(x|0,0x27d4eb2d)^Math.imul(y|0,0x165667b1)^Math.imul((s|0)+1,0x9e3779b1);h=Math.imul(h^(h>>>15),0x85ebca6b);h=Math.imul(h^(h>>>13),0xc2b2ae35);return((h^(h>>>16))>>>0)/4294967296}
function out(x,y){const seed=10000+Math.floor(hash(x,y,7)*89999);return{id:x+','+y,seed,shade:hash(x,y,2),
 created:new Date(Date.UTC(2026,9,1+Math.floor(hash(x,y,3)*11),Math.floor(hash(x,y,4)*24),Math.floor(hash(x,y,5)*60))),score:Math.floor(hash(x,y,6)*5)+1}}
function fmtDate(d){return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'})}

const C=120,G=6,PAD=120,MINZ=.35,MAXZ=4,START_X=0,START_Y=0,START_Z=()=>innerWidth<560?.8:1;
function layout(x0,y0,x1,y1){const r=[];for(let gx=Math.floor(x0/C);gx<=Math.floor(x1/C);gx++)for(let gy=Math.floor(y0/C);gy<=Math.floor(y1/C);gy++){
 const o=out(gx,gy);r.push({id:o.id,x:gx*C+G/2,y:gy*C+G/2,s:C-G,shade:.1+o.shade*.9,o,label:'Output #'+o.seed,
  html:'<span class="cap">#'+o.seed+' <i>'+'★'.repeat(o.score)+'</i></span>'})}return r}
function afterRender(){w.classList.toggle('near',cam.z>=1.6)}
function describe(c){return 'Open in Focus → <b>#'+c.o.seed+'</b> · '+'★'.repeat(c.o.score)+' · '+fmtDate(c.o.created)}

const vp=document.getElementById('vp'),w=document.getElementById('w'),t=document.getElementById('t'),zl=document.getElementById('zl'),hint=document.getElementById('hint');
const nodes=new Map();let cam={x:0,y:0,z:1},queued=false,sel=null;
const clampZ=z=>Math.min(MAXZ,Math.max(MINZ,z));
function frame(){if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;render()})}}
function make(c){const d=document.createElement('button');d.className='out'+(c.cls?' '+c.cls:'');d.dataset.id=c.id;d.tabIndex=-1;
 d.style.cssText='left:'+c.x+'px;top:'+c.y+'px;width:'+c.s+'px;height:'+c.s+'px;--k:'+Math.round(c.shade*100)+'%;--d:'+Math.round(hash(c.x|0,c.y|0,99)*140)+'ms';
 d.setAttribute('aria-label',c.label);d._c=c;if(c.html)d.innerHTML=c.html;if(sel===c.id)d.classList.add('sel');return d}
function render(){w.style.transform='scale('+cam.z+') translate('+(-cam.x)+'px,'+(-cam.y)+'px)';w.style.setProperty('--z',cam.z);
 const W=vp.clientWidth/cam.z,H=vp.clientHeight/cam.z,seen=new Set(),frag=document.createDocumentFragment();
 for(const c of layout(cam.x-PAD,cam.y-PAD,cam.x+W+PAD,cam.y+H+PAD)){seen.add(c.id);if(!nodes.has(c.id)){const d=make(c);frag.appendChild(d);nodes.set(c.id,d)}}
 w.appendChild(frag);for(const [k,d] of nodes)if(!seen.has(k)){d.remove();nodes.delete(k)}
 zl.textContent=Math.round(cam.z*100)+'%';if(typeof afterRender==='function')afterRender()}
function zoomAt(px,py,z){z=clampZ(z);const wx=cam.x+px/cam.z,wy=cam.y+py/cam.z;cam={x:wx-px/z,y:wy-py/z,z};frame()}
function interacted(){if(!hint.classList.contains('gone'))setTimeout(()=>hint.classList.add('gone'),1800)}
let tt;function toast(html){t.innerHTML=html;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function select(el){if(sel&&nodes.get(sel))nodes.get(sel).classList.remove('sel');sel=el?el.dataset.id:null;if(el){el.classList.add('sel');toast(describe(el._c))}}
// wheel: pan, ctrl/meta (trackpad pinch) to zoom
vp.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;
 if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,cam.z*Math.exp(-e.deltaY*k*(e.ctrlKey?.01:.003)));
 else{cam.x+=e.deltaX*k/cam.z;cam.y+=e.deltaY*k/cam.z;frame()}interacted()},{passive:false});
// Safari trackpad pinch
let gz=1;vp.addEventListener('gesturestart',e=>{e.preventDefault();gz=cam.z});
vp.addEventListener('gesturechange',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,gz*e.scale);interacted()});
// pointers: one = drag-pan, two = pinch-zoom; a tap/click on a square opens it
const ptrs=new Map();let moved=0,pinch=null,suppress=false;
function pinchState(){const [a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
vp.addEventListener('pointerdown',e=>{if(e.button>0)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1){moved=0;suppress=false}
 if(ptrs.size===2){pinch=pinchState();suppress=true}});
vp.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===2){const n=pinchState();zoomAt(n.x,n.y,cam.z*n.d/pinch.d);cam.x-=(n.x-pinch.x)/cam.z;cam.y-=(n.y-pinch.y)/cam.z;pinch=n;interacted();return}
 moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){if(!suppress){suppress=true;vp.classList.add('dragging');try{vp.setPointerCapture(e.pointerId)}catch(_){}}
  cam.x-=dx/cam.z;cam.y-=dy/cam.z;frame();interacted()}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)vp.classList.remove('dragging')}
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('click',e=>{if(suppress){suppress=false;return}const el=e.target.closest('.out');select(el)});
// keyboard
vp.addEventListener('keydown',e=>{const s=60/cam.z,m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key];
 if(m){cam.x+=m[0];cam.y+=m[1];frame();e.preventDefault()}else if(e.key==='+'||e.key==='=')zoomBy(1.25);else if(e.key==='-')zoomBy(.8);else if(e.key==='0')zoomTo(1);else if(e.key==='Escape')select(null)});
function zoomBy(f){zoomAt(vp.clientWidth/2,vp.clientHeight/2,cam.z*f)}function zoomTo(z){zoomAt(vp.clientWidth/2,vp.clientHeight/2,z)}
document.getElementById('zin').onclick=()=>zoomBy(1.25);document.getElementById('zout').onclick=()=>zoomBy(.8);zl.onclick=()=>zoomTo(START_Z());
addEventListener('resize',frame);
// start centred on the world origin
if(typeof setup==='function')setup();
(function(){const z=START_Z();cam={x:START_X-vp.clientWidth/2/z,y:START_Y-vp.clientHeight/2/z,z};render();vp.focus({preventScroll:true})})();
</script></body></html>
