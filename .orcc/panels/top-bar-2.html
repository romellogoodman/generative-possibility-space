<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Toolbar</title>
<style>
:root {
  --color-text: #e5e5e5;
  --color-text-light: #7b7b78;
  --color-bg: #1b1b1b;
  --color-surface: #262625;
  --color-line: #333331;
  --color-frame: #111111;
  --color-highlight: #6f9bff;
  --color-bar: #1f1f1e;
  --output-light: 82%;
  --output-range: 56%;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --spacing-unit: 8px;
  --spacing-2x: 16px;
  --spacing-3x: 24px;
  --row-h: 44px;
  --bar-h: 44px;
  --gutter: 16px;
  --ease: cubic-bezier(.2, .75, .2, 1);
  --t: 300ms;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --color-text: #1a1a1a;
    --color-text-light: #6f6f6b;
    --color-bg: #f4f4f2;
    --color-surface: #ffffff;
    --color-line: #e2e2de;
    --color-frame: #fcfcfb;
    --color-highlight: #2f6fed;
    --color-bar: #fbfbfa;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --color-text: #1a1a1a;
  --color-text-light: #6f6f6b;
  --color-bg: #f4f4f2;
  --color-surface: #ffffff;
  --color-line: #e2e2de;
  --color-frame: #fcfcfb;
  --color-highlight: #2f6fed;
  --color-bar: #fbfbfa;
  color-scheme: light;
}
@media (max-width: 760px) {
  :root { --bar-h: 88px; --gutter: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --t: 1ms; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--color-bg);
  color: var(--color-text);
  font: 13px/1.35 system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit; color: inherit; background: none; border: 0;
  cursor: pointer; text-align: inherit; padding: 0;
}
button:focus-visible { outline: 2px solid var(--color-highlight); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.output {
  background: hsl(0 0% calc(var(--output-light) - var(--shade, .5) * var(--output-range)));
  border-radius: 2px;
}
.frame {
  display: grid; place-items: center;
  background: var(--color-frame);
  box-shadow: inset 0 0 0 1px var(--color-line);
  border-radius: 3px;
  aspect-ratio: 1;
}
.score { font-size: 10px; letter-spacing: 1px; white-space: nowrap; }
.score__empty { opacity: .22; }

/* ================= Toolbar ================= */
.toolbar {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "left middle right";
  column-gap: 20px;
  height: var(--bar-h);
  padding: 0 var(--gutter);
  background: var(--color-bar);
  border-bottom: 1px solid var(--color-line);
  transition: height var(--t) var(--ease);
}
.toolbar--still, .toolbar--still * { transition: none !important; }

.toolbar__left { grid-area: left; display: flex; align-items: stretch; min-width: 0; height: var(--row-h); }
.toolbar__middle { grid-area: middle; position: relative; height: var(--row-h); min-width: 0; }
.toolbar__right { grid-area: right; position: relative; height: var(--row-h); justify-self: end;
  transition: width var(--t) var(--ease); }

.toolbar__wordmark {
  display: flex; align-items: center;
  font-family: var(--font-mono); font-weight: 700; letter-spacing: .12em; font-size: 12px;
  padding-right: 14px; margin-right: 14px;
  border-right: 1px solid var(--color-line);
  max-width: 80px; overflow: hidden; white-space: nowrap;
  transition: max-width var(--t) var(--ease), opacity var(--t), padding var(--t) var(--ease), margin var(--t) var(--ease), border-color var(--t);
}

/* The nav slot holds the tabs or, in Focus, back + trail. Its width morphs between them. */
.toolbar__nav { position: relative; overflow: hidden; height: 100%;
  transition: width var(--t) var(--ease); }
.toolbar__pane {
  position: absolute; top: 0; bottom: 0; left: 0;
  width: max-content; display: flex; align-items: center; gap: 10px;
  transition: opacity calc(var(--t) * .8), transform var(--t) var(--ease), visibility 0s linear var(--t);
  opacity: 0; visibility: hidden;
}
.toolbar__pane--tabs { transform: translateX(-28px); align-items: stretch; }
.toolbar__pane--focus { transform: translateX(36px); }
.toolbar__pane--active {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity var(--t) calc(var(--t) * .15), transform var(--t) var(--ease), visibility 0s;
}

.tabs { position: relative; display: flex; align-items: stretch; gap: 2px; }
.tabs__tab {
  display: flex; align-items: center; padding: 0 10px; font-size: 14px;
  color: var(--color-text-light); transition: color .2s;
}
.tabs__tab:hover { color: var(--color-text); }
.tabs__tab[aria-selected="true"] { color: var(--color-text); }
.tabs__underline {
  position: absolute; bottom: -1px; height: 2px; left: 0; width: 0;
  background: var(--color-text); border-radius: 2px 2px 0 0;
  transition: left var(--t) var(--ease), width var(--t) var(--ease);
}

.back {
  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px;
  border-radius: 6px; color: var(--color-text); white-space: nowrap;
}
.back:hover { background: var(--color-surface); }
.back kbd {
  font-family: var(--font-mono); font-size: 10px; color: var(--color-text-light);
  border: 1px solid var(--color-line); border-radius: 4px; padding: 0 4px; line-height: 15px;
}

.trail { display: flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px solid var(--color-line); height: 24px; }
.trail__more { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-light); margin-right: 2px; }
.trail__sep { color: var(--color-text-light); font-size: 11px; }
.trail__crumb { width: 22px; height: 22px; display: block; opacity: .62; transition: opacity .15s; animation: crumb-in var(--t) var(--ease); }
.trail__crumb:hover { opacity: 1; }
.trail__crumb .frame { width: 100%; height: 100%; }
.trail__crumb--current { width: 26px; height: 26px; opacity: 1; }
.trail__crumb--current .frame { box-shadow: inset 0 0 0 1px var(--color-text-light); }
@keyframes crumb-in { from { opacity: 0; transform: scale(.6); } }

/* Middle: one control group per mode, stacked; the active one slides in */
.toolbar__group {
  position: absolute; top: 0; bottom: 0; left: 0;
  display: flex; align-items: center; gap: 10px; width: max-content;
  opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity calc(var(--t) * .6), transform var(--t) var(--ease), visibility 0s linear var(--t);
}
.toolbar__group--active {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity var(--t) calc(var(--t) * .25), transform var(--t) var(--ease) calc(var(--t) * .1), visibility 0s;
}
.toolbar__divider { width: 1px; height: 18px; background: var(--color-line); }

/* Right: live context, crossfading, width morphs */
.toolbar__context {
  position: absolute; top: 0; bottom: 0; right: 0; width: max-content;
  display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--color-text-light);
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity calc(var(--t) * .6), transform var(--t) var(--ease), visibility 0s linear var(--t);
}
.toolbar__context--active {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity var(--t) calc(var(--t) * .25), transform var(--t) var(--ease), visibility 0s;
}
.toolbar__context strong { color: var(--color-text); font-weight: 500; }
.icon-btn {
  width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  color: var(--color-text-light); font-size: 14px;
}
.icon-btn:hover { background: var(--color-surface); color: var(--color-text); }
.zoom { min-width: 4.2ch; text-align: center; color: var(--color-text); }
.text-btn { height: 24px; padding: 0 8px; border-radius: 6px; color: var(--color-text-light); white-space: nowrap; }
.text-btn:hover { background: var(--color-surface); color: var(--color-text); }

/* Segmented control with a sliding thumb */
.segmented {
  position: relative; display: inline-flex; padding: 2px;
  border: 1px solid var(--color-line); border-radius: 7px; background: var(--color-surface);
}
.segmented__option {
  position: relative; z-index: 1; padding: 3px 10px; border-radius: 5px;
  color: var(--color-text-light); white-space: nowrap; transition: color .2s;
}
.segmented__option:hover { color: var(--color-text); }
.segmented__option--active, .segmented__option--active:hover { color: var(--color-bg); }
.segmented__thumb {
  position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 5px;
  background: var(--color-text);
  transition: left var(--t) var(--ease), width var(--t) var(--ease);
}
.label-short { display: none; }
.field-label { color: var(--color-text-light); white-space: nowrap; }

/* Grouped-only controls unfold inline */
.reveal {
  display: grid; grid-template-columns: 0fr; opacity: 0;
  transition: grid-template-columns var(--t) var(--ease), opacity calc(var(--t) * .7);
}
.reveal > div { overflow: hidden; min-width: 0; display: flex; align-items: center; gap: 10px; }
.reveal--open { grid-template-columns: 1fr; opacity: 1; }
.reveal--open > div { overflow: visible; }

/* Sort dropdown */
.dropdown { position: relative; }
.dropdown__button {
  display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 10px;
  border: 1px solid var(--color-line); border-radius: 7px; white-space: nowrap;
}
.dropdown__button:hover, .dropdown__button[aria-expanded="true"] { background: var(--color-surface); }
.dropdown__button .muted { color: var(--color-text-light); }
.dropdown__icon { display: none; color: var(--color-text-light); }
.dropdown__caret { color: var(--color-text-light); font-size: 9px; }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 190px;
  padding: 4px; border: 1px solid var(--color-line); border-radius: 9px;
  background: var(--color-surface); box-shadow: 0 10px 30px rgb(0 0 0 / 28%);
  opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top left; visibility: hidden;
  transition: opacity .15s, transform .2s var(--ease), visibility 0s linear .2s;
}
.menu--open { opacity: 1; transform: none; visibility: visible; transition: opacity .15s, transform .2s var(--ease), visibility 0s; }
.menu__heading { padding: 6px 8px 4px; font-size: 11px; color: var(--color-text-light); }
.menu__item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  padding: 6px 8px; border-radius: 6px;
}
.menu__item:hover { background: var(--color-line); }
.menu__item .mark { color: var(--color-text-light); font-family: var(--font-mono); font-size: 11px; }
.menu__item--on .mark { color: var(--color-text); }
.menu__section--group { display: none; border-top: 1px solid var(--color-line); margin-top: 4px; padding-top: 2px; }

@media (max-width: 1100px) {
  .reveal { display: none; }
  .toolbar[data-layout="grouped"] .menu__section--group { display: block; }
}

/* ===== Phone: middle zone drops to its own row ===== */
@media (max-width: 760px) {
  .toolbar {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "left right" "middle middle";
    grid-template-rows: var(--row-h) var(--row-h);
  }
  .toolbar__middle { border-top: 1px solid var(--color-line); margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter); }
  .toolbar__group { left: var(--gutter); }
  .toolbar__wordmark { padding-right: 10px; margin-right: 10px; }
  .toolbar[data-focus="true"] .toolbar__wordmark { max-width: 0; padding-right: 0; margin-right: 0; opacity: 0; border-color: transparent; }
  .back { padding: 0 6px 0 2px; }
  .back kbd, .back .back__to { display: none; }
  .trail { padding-left: 8px; }
  .tabs__tab { padding: 0 8px; }
  .label-long { display: none; }
  .label-short { display: inline; }
  .segmented__option { padding: 3px 9px; }
  .dropdown__button .muted-label { display: none; }
  .dropdown__icon { display: inline; }
  .dropdown .menu { left: auto; right: 0; transform-origin: top right; }
  .toolbar__context .hide-phone { display: none; }
}

/* ================= Content stand-ins ================= */
.stage { position: fixed; inset: var(--bar-h) 0 0 0; transition: inset var(--t) var(--ease); }
.view {
  position: absolute; inset: 0; opacity: 0; visibility: hidden;
  transition: opacity var(--t), visibility 0s linear var(--t);
}
.view--active { opacity: 1; visibility: visible; transition: opacity var(--t), visibility 0s; }

/* Canvas */
.canvas { overflow: hidden; cursor: grab; touch-action: none; }
.canvas--dragging { cursor: grabbing; }
.canvas__world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cell {
  position: absolute; display: grid; place-items: center;
  transition: left .45s var(--ease), top .45s var(--ease), width .45s var(--ease), height .45s var(--ease);
}
.cell__square { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.cell .output { transition: outline-color .15s; outline: 2px solid transparent; outline-offset: 3px; }
.cell:hover .output { outline-color: var(--color-highlight); }
.cell__caption {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px);
  display: flex; justify-content: space-between; font-size: 9px; color: var(--color-text-light);
  opacity: 0; transition: opacity .3s;
}
.canvas[data-layout="contact"] .cell__caption { opacity: 1; }
.canvas[data-layout="contact"] .cell__square { background: var(--color-frame); box-shadow: inset 0 0 0 1px var(--color-line); border-radius: 2px; }

/* Table */
.table { overflow: auto; padding: 16px var(--gutter) 40px; }
.sheet { width: 100%; border-collapse: collapse; font-size: 12px; }
.sheet th { text-align: left; font-weight: 400; color: var(--color-text-light); padding: 6px 8px; border-bottom: 1px solid var(--color-line); position: sticky; top: -16px; background: var(--color-bg); white-space: nowrap; }
.sheet th button:hover { color: var(--color-text); }
.sheet th .on { color: var(--color-text); }
.sheet td { padding: 5px 8px; border-bottom: 1px solid var(--color-line); white-space: nowrap; }
.sheet tr { cursor: pointer; }
.sheet tbody tr:hover td { background: var(--color-surface); }
.thumb { width: 26px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.card { display: block; width: 100%; }
.card:hover .frame { box-shadow: inset 0 0 0 1px var(--color-text-light); }
.card__meta { display: flex; justify-content: space-between; padding-top: 5px; font-size: 11px; color: var(--color-text-light); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; height: 100%; }
.split__list { overflow: auto; }
.split__row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 4px 6px; border-radius: 5px; }
.split__row:hover, .split__row--on { background: var(--color-surface); }
.split__preview { position: sticky; top: 0; align-self: start; }
.split__preview .frame { width: min(100%, 420px); }
.split__preview p { color: var(--color-text-light); }
.table--split { overflow: hidden; }
.table--split .split { height: calc(100% - 0px); }
.group { margin-bottom: 14px; }
.group__head { display: flex; gap: 10px; align-items: baseline; width: 100%; padding: 6px 0; border-bottom: 1px solid var(--color-line); }
.group__head .count { color: var(--color-text-light); }
.group__chev { display: inline-block; transition: transform .2s; color: var(--color-text-light); }
.group--collapsed .group__chev { transform: rotate(-90deg); }
.group__body { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; padding-top: 10px; }
.group--collapsed .group__body { display: none; }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; }
  .split__preview { display: none; }
  .hide-phone-col { display: none; }
}

/* Focus */
.focus { background: var(--color-bg); overflow: auto; transform: scale(.985);
  transition: opacity var(--t), transform var(--t) var(--ease), visibility 0s linear var(--t); }
.focus.view--active { transform: none; transition: opacity var(--t), transform var(--t) var(--ease), visibility 0s; }
.focus__inner { min-height: 100%; display: grid; place-items: center; padding: 24px var(--gutter); }
.hero { width: min(52vh, 100%); }
.alts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.alt { width: 64px; display: block; }
.alt:hover .frame { box-shadow: inset 0 0 0 1px var(--color-text-light); }
.alt__delta { display: block; text-align: center; font-size: 10px; color: var(--color-text-light); padding-top: 3px; }
.compass { display: grid; grid-template-columns: 80px minmax(0, 46vh) 80px; grid-template-rows: 80px auto 80px; gap: 14px; align-items: center; justify-items: center; }
.compass .hero { width: 100%; grid-area: 2 / 2; }
.inspector { display: grid; grid-template-columns: minmax(0, 52vh) 240px; gap: 24px; align-items: start; }
.inspector .hero { width: 100%; }
.props { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12px; }
.props dt { color: var(--color-text-light); }
.props dd { margin: 0; }
.inspector .alts { justify-content: start; }
.inspector .alt { width: 48px; }
.dials { display: grid; gap: 14px; justify-items: center; }
.dial { display: flex; align-items: center; gap: 8px; }
.dial__name { width: 44px; color: var(--color-text-light); font-size: 12px; }
.dial .alt { width: 48px; }
.dial .alt--current .frame { box-shadow: inset 0 0 0 2px var(--color-text); }
@media (max-width: 760px) {
  .inspector { grid-template-columns: 1fr; }
  .compass { grid-template-columns: 56px 1fr 56px; grid-template-rows: 56px auto 56px; }
  .compass .alt { width: 52px; }
  .dial .alt { width: 40px; }
}
</style>
</head>
<body>

<header class="toolbar toolbar--still" id="toolbar" data-mode="canvas" data-focus="false" data-layout="spreadsheet">
  <div class="toolbar__left">
    <span class="toolbar__wordmark">GPS</span>
    <div class="toolbar__nav" id="nav">
      <div class="toolbar__pane toolbar__pane--tabs toolbar__pane--active" id="paneTabs">
        <div class="tabs" role="tablist" aria-label="Mode">
          <button class="tabs__tab" role="tab" data-mode="canvas" aria-selected="true">Canvas</button>
          <button class="tabs__tab" role="tab" data-mode="table" aria-selected="false">Table</button>
          <span class="tabs__underline" id="underline"></span>
        </div>
      </div>
      <div class="toolbar__pane toolbar__pane--focus" id="paneFocus">
        <button class="back" id="back" title="Back (Esc)">← <span id="backLabel">Table</span><kbd>Esc</kbd></button>
        <div class="trail" id="trail"></div>
      </div>
    </div>
  </div>

  <div class="toolbar__middle">
    <div class="toolbar__group toolbar__group--active" data-for="canvas">
      <div class="segmented" data-seg="canvasLayout" role="radiogroup" aria-label="Canvas layout">
        <span class="segmented__thumb"></span>
        <button class="segmented__option" data-value="staggered">Staggered</button>
        <button class="segmented__option" data-value="contact">Contact sheet</button>
      </div>
    </div>

    <div class="toolbar__group" data-for="table">
      <div class="segmented" data-seg="tableLayout" role="radiogroup" aria-label="Table layout">
        <span class="segmented__thumb"></span>
        <button class="segmented__option" data-value="spreadsheet"><span class="label-long">Spreadsheet</span><span class="label-short">Sheet</span></button>
        <button class="segmented__option" data-value="cards">Cards</button>
        <button class="segmented__option" data-value="split">Split</button>
        <button class="segmented__option" data-value="grouped">Grouped</button>
      </div>
      <div class="dropdown" id="sortDropdown">
        <button class="dropdown__button" id="sortButton" aria-haspopup="menu" aria-expanded="false">
          <span class="dropdown__icon">⇅</span><span class="muted muted-label">Sort</span>
          <span id="sortKeyLabel">Seed</span><span class="mono" id="sortDirLabel">↑</span>
          <span class="dropdown__caret">▼</span>
        </button>
        <div class="menu" id="sortMenu" role="menu">
          <div class="menu__heading">Sort by</div>
          <div id="sortItems"></div>
          <div class="menu__section--group">
            <div class="menu__heading">Group by</div>
            <div id="groupItems"></div>
            <button class="menu__item" data-action="collapse-all"><span class="collapse-label">Collapse all</span></button>
          </div>
        </div>
      </div>
      <div class="reveal" id="groupReveal">
        <div>
          <span class="toolbar__divider"></span>
          <span class="field-label">Group</span>
          <div class="segmented" data-seg="groupBy" role="radiogroup" aria-label="Group by">
            <span class="segmented__thumb"></span>
            <button class="segmented__option" data-value="day">Day</button>
            <button class="segmented__option" data-value="score">Score</button>
            <button class="segmented__option" data-value="size">Size</button>
          </div>
          <button class="text-btn" data-action="collapse-all"><span class="collapse-label">Collapse all</span></button>
        </div>
      </div>
    </div>

    <div class="toolbar__group" data-for="focus">
      <div class="segmented" data-seg="focusLayout" role="radiogroup" aria-label="Focus layout">
        <span class="segmented__thumb"></span>
        <button class="segmented__option" data-value="strip">Strip</button>
        <button class="segmented__option" data-value="compass">Compass</button>
        <button class="segmented__option" data-value="inspector">Inspector</button>
        <button class="segmented__option" data-value="dials">Dials</button>
      </div>
    </div>
  </div>

  <div class="toolbar__right" id="right">
    <div class="toolbar__context toolbar__context--active" data-for="canvas">
      <button class="icon-btn" data-action="zoom-out" title="Zoom out">−</button>
      <span class="mono zoom" id="zoomLabel">100%</span>
      <button class="icon-btn" data-action="zoom-in" title="Zoom in">+</button>
      <button class="icon-btn" data-action="reset" title="Reset view">⟲</button>
    </div>
    <div class="toolbar__context" data-for="table">
      <span><strong class="mono">60</strong> outputs</span><span class="hide-phone" id="groupCount"></span>
    </div>
    <div class="toolbar__context" data-for="focus">
      <strong class="mono" id="focusSeed">#000000</strong>
      <span id="focusScore"></span>
    </div>
  </div>
</header>

<main class="stage">
  <section class="view view--active canvas" id="canvasView" data-layout="staggered" aria-label="Canvas">
    <div class="canvas__world" id="world"></div>
  </section>
  <section class="view table" id="tableView" aria-label="Table"></section>
  <section class="view focus" id="focusView" aria-label="Focus"></section>
</main>

<script>
(() => {
  // ---------- Data (same stand-in model as the app) ----------
  function hash(x, y, seed = 0) {
    let h = (seed * 2654435761 + x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
  }
  function makeOutput(gx, gy) {
    const day = Math.floor(hash(gx, gy, 3) * 11);
    const hour = Math.floor(hash(gx, gy, 4) * 24);
    const minute = Math.floor(hash(gx, gy, 5) * 60);
    return {
      id: gx + "," + gy, gx, gy,
      seed: Math.floor(hash(gx, gy, 7) * 1e6),
      size: 0.55 + hash(gx, gy, 1) * 0.35,
      shade: 0.45 + hash(gx, gy, 2) * 0.55,
      score: Math.floor(hash(gx, gy, 6) * 5) + 1,
      created: new Date(Date.UTC(2026, 9, 1 + day, hour, minute)),
    };
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function vary(o, dSize, dShade, k) {
    const s = o.seed % 99991;
    return {
      id: "v" + s + "-" + k, seed: Math.floor(hash(s, k, 11) * 1e6),
      size: clamp(o.size + dSize, 0.3, 0.95), shade: clamp(o.shade + dShade, 0.1, 1),
      score: Math.floor(hash(s, k, 12) * 5) + 1, created: o.created,
    };
  }
  const TABLE = [];
  for (let gy = 0; gy < 6; gy++) for (let gx = 0; gx < 10; gx++) TABLE.push(makeOutput(gx, gy));
  const COLS = 16, ROWS = 10, CANVAS = [];
  for (let gy = 0; gy < ROWS; gy++) for (let gx = 0; gx < COLS; gx++) CANVAS.push(makeOutput(gx, gy));
  const byId = new Map();
  const remember = (o) => (byId.set(o.id, o), o);
  [...TABLE, ...CANVAS].forEach(remember);

  const fmtDate = (d) => d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "UTC" });
  const fmtDay = (d) => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  const score = (v) => `<span class="score" aria-label="${v} of 5">${"●".repeat(v)}<span class="score__empty">${"●".repeat(5 - v)}</span></span>`;
  const out = (o, scale = 1) => `<div class="output" style="width:${o.size * 100 * scale}%;height:${o.size * 100 * scale}%;--shade:${o.shade}"></div>`;
  const frame = (o) => `<div class="frame">${out(o)}</div>`;

  // ---------- State ----------
  const S = {
    mode: "canvas", canvasLayout: "staggered", tableLayout: "spreadsheet",
    sort: { key: "seed", dir: 1 }, groupBy: "day", collapsed: new Set(),
    focus: null, focusLayout: "strip", preview: TABLE[0],
    cam: { x: 0, y: 0, z: 1 },
  };
  const SORT_KEYS = [
    { id: "seed", label: "Seed" }, { id: "size", label: "Size" }, { id: "shade", label: "Shade" },
    { id: "score", label: "Score" }, { id: "created", label: "Created" },
  ];
  const GROUPS = {
    day: { label: "Day", key: (o) => fmtDay(o.created), order: (o) => +o.created },
    score: { label: "Score", key: (o) => "Score " + o.score, order: (o) => -o.score },
    size: { label: "Size", key: (o) => (o.size < 0.67 ? "Small" : o.size < 0.78 ? "Medium" : "Large"), order: (o) => o.size },
  };
  const MODE_LABEL = { canvas: "Canvas", table: "Table" };

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const toolbar = $("#toolbar");
  const phone = matchMedia("(max-width: 760px)");

  // ---------- Bar ----------
  function placeSegmented(seg) {
    const val = S[seg.dataset.seg];
    let active = null;
    $$(".segmented__option", seg).forEach((b) => {
      const on = b.dataset.value === val;
      b.classList.toggle("segmented__option--active", on);
      b.setAttribute("aria-checked", on);
      if (on) active = b;
    });
    const thumb = $(".segmented__thumb", seg);
    if (active) { thumb.style.left = active.offsetLeft + "px"; thumb.style.width = active.offsetWidth + "px"; }
  }

  function renderTrail() {
    const f = S.focus, el = $("#trail");
    if (!f) return;
    const max = phone.matches ? 3 : 5;
    const from = Math.max(0, f.trail.length - max);
    let html = from > 0 ? `<span class="trail__more" title="${from} earlier">+${from}</span>` : "";
    f.trail.slice(from).forEach((o, n) => {
      html += `<button class="trail__crumb" data-jump="${from + n}" title="Back to #${o.seed}">${frame(o)}</button><span class="trail__sep">›</span>`;
    });
    html += `<span class="trail__crumb trail__crumb--current" title="#${f.output.seed} (current)">${frame(f.output)}</span>`;
    el.innerHTML = html;
    el.style.display = f.trail.length ? "" : "none";
  }

  function updateBar() {
    const view = S.focus ? "focus" : S.mode;
    toolbar.dataset.mode = view;
    toolbar.dataset.focus = !!S.focus;
    toolbar.dataset.layout = S.tableLayout;

    // Tabs + underline
    let activeTab;
    $$(".tabs__tab").forEach((t) => {
      const on = t.dataset.mode === S.mode;
      t.setAttribute("aria-selected", on);
      if (on) activeTab = t;
    });
    const u = $("#underline");
    u.style.left = activeTab.offsetLeft + 4 + "px";
    u.style.width = activeTab.offsetWidth - 8 + "px";

    // Left slot morph: tabs <-> back + trail
    if (S.focus) {
      $("#backLabel").innerHTML = `<span class="back__to">Back to </span>${MODE_LABEL[S.focus.from]}`;
      renderTrail();
    }
    const paneTabs = $("#paneTabs"), paneFocus = $("#paneFocus");
    paneTabs.classList.toggle("toolbar__pane--active", !S.focus);
    paneFocus.classList.toggle("toolbar__pane--active", !!S.focus);
    $("#nav").style.width = (S.focus ? paneFocus : paneTabs).offsetWidth + "px";

    // Middle groups
    $$(".toolbar__group").forEach((g) => g.classList.toggle("toolbar__group--active", g.dataset.for === view));
    $$(".segmented").forEach(placeSegmented);
    $("#groupReveal").classList.toggle("reveal--open", S.tableLayout === "grouped");

    // Sort label + menu
    const sk = SORT_KEYS.find((k) => k.id === S.sort.key);
    $("#sortKeyLabel").textContent = sk.label;
    $("#sortDirLabel").textContent = S.sort.dir > 0 ? "↑" : "↓";
    $("#sortItems").innerHTML = SORT_KEYS.map((k) => {
      const on = k.id === S.sort.key;
      return `<button class="menu__item${on ? " menu__item--on" : ""}" role="menuitemradio" aria-checked="${on}" data-sort="${k.id}"><span>${k.label}</span><span class="mark">${on ? (S.sort.dir > 0 ? "↑ asc" : "↓ desc") : ""}</span></button>`;
    }).join("");
    $("#groupItems").innerHTML = Object.entries(GROUPS).map(([id, g]) => {
      const on = id === S.groupBy;
      return `<button class="menu__item${on ? " menu__item--on" : ""}" role="menuitemradio" aria-checked="${on}" data-group="${id}"><span>${g.label}</span><span class="mark">${on ? "✓" : ""}</span></button>`;
    }).join("");
    const groups = groupList();
    const allCollapsed = groups.every((g) => S.collapsed.has(g.name));
    $$(".collapse-label").forEach((e) => (e.textContent = allCollapsed ? "Expand all" : "Collapse all"));

    // Right context
    $("#zoomLabel").textContent = Math.round(S.cam.z * 100) + "%";
    $("#groupCount").textContent = S.tableLayout === "grouped" ? ` · ${groups.length} ${GROUPS[S.groupBy].label.toLowerCase()}${S.groupBy === "day" ? "s" : " groups"}` : "";
    if (S.focus) {
      $("#focusSeed").textContent = "#" + S.focus.output.seed;
      $("#focusScore").innerHTML = score(S.focus.output.score);
    }
    let activeCtx;
    $$(".toolbar__context").forEach((c) => {
      const on = c.dataset.for === view;
      c.classList.toggle("toolbar__context--active", on);
      if (on) activeCtx = c;
    });
    $("#right").style.width = activeCtx.offsetWidth + "px";

    // Views
    $("#canvasView").classList.toggle("view--active", S.mode === "canvas");
    $("#tableView").classList.toggle("view--active", S.mode === "table");
    $("#focusView").classList.toggle("view--active", !!S.focus);
  }

  // ---------- Canvas ----------
  const world = $("#world"), canvasView = $("#canvasView");
  world.innerHTML = CANVAS.map((o) =>
    `<button class="cell" data-open="${o.id}" title="#${o.seed}"><span class="cell__square">${out(o)}<span class="cell__caption mono"><span>#${o.seed}</span>${score(o.score)}</span></span></button>`).join("");
  const cells = $$(".cell", world);
  function layoutCanvas() {
    canvasView.dataset.layout = S.canvasLayout;
    const contact = S.canvasLayout === "contact";
    const size = contact ? 84 : 96, stepX = contact ? 100 : 128, stepY = contact ? 118 : 128;
    cells.forEach((c, i) => {
      const gx = i % COLS, gy = Math.floor(i / COLS);
      const y = gy * stepY + (!contact && gx % 2 ? stepY / 2 : 0);
      c.style.left = gx * stepX + "px"; c.style.top = y + "px";
      c.style.width = size + "px"; c.style.height = size + "px";
    });
  }
  function applyCam() {
    world.style.transform = `translate(${S.cam.x}px, ${S.cam.y}px) scale(${S.cam.z})`;
    $("#zoomLabel").textContent = Math.round(S.cam.z * 100) + "%";
  }
  function resetCam() {
    const r = canvasView.getBoundingClientRect();
    const z = phone.matches ? 0.6 : 1;
    S.cam = { x: (r.width - 15 * 128 * z - 96 * z) / 2, y: 28, z };
    applyCam();
  }
  function zoomAt(factor, cx, cy) {
    const z = clamp(S.cam.z * factor, 0.25, 3);
    const k = z / S.cam.z;
    S.cam.x = cx - (cx - S.cam.x) * k; S.cam.y = cy - (cy - S.cam.y) * k; S.cam.z = z;
    applyCam();
  }
  let drag = null;
  canvasView.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, cx: S.cam.x, cy: S.cam.y, moved: false, id: e.pointerId };
  });
  canvasView.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; canvasView.setPointerCapture(drag.id); canvasView.classList.add("canvas--dragging"); }
    if (drag.moved) { S.cam.x = drag.cx + dx; S.cam.y = drag.cy + dy; applyCam(); }
  });
  const endDrag = () => { if (drag && drag.moved) canvasView.dataset.justDragged = "1"; drag = null; canvasView.classList.remove("canvas--dragging"); };
  canvasView.addEventListener("pointerup", endDrag);
  canvasView.addEventListener("pointercancel", endDrag);
  canvasView.addEventListener("click", (e) => {
    if (canvasView.dataset.justDragged) { delete canvasView.dataset.justDragged; e.stopPropagation(); }
  }, true);
  canvasView.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = canvasView.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      zoomAt(Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
    } else { S.cam.x -= e.deltaX; S.cam.y -= e.deltaY; applyCam(); }
  }, { passive: false });
  function zoomCenter(f) { const r = canvasView.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }

  // ---------- Table ----------
  function sorted() {
    const { key, dir } = S.sort;
    return [...TABLE].sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * dir);
  }
  function groupList() {
    const g = GROUPS[S.groupBy], map = new Map();
    sorted().forEach((o) => { const k = g.key(o); if (!map.has(k)) map.set(k, []); map.get(k).push(o); });
    return [...map.entries()].map(([name, items]) => ({ name, items }))
      .sort((a, b) => g.order(a.items[0]) - g.order(b.items[0]));
  }
  function renderTable() {
    const el = $("#tableView"), rows = sorted();
    el.className = "view table" + (S.mode === "table" ? " view--active" : "") + (S.tableLayout === "split" ? " table--split" : "");
    if (S.tableLayout === "spreadsheet") {
      const head = SORT_KEYS.map((k) => {
        const on = k.id === S.sort.key;
        const cls = k.id === "shade" || k.id === "created" ? ' class="hide-phone-col"' : "";
        return `<th${cls}><button data-sort="${k.id}" class="${on ? "on" : ""}">${k.label} ${on ? (S.sort.dir > 0 ? "↑" : "↓") : ""}</button></th>`;
      }).join("");
      el.innerHTML = `<table class="sheet"><thead><tr><th></th>${head}</tr></thead><tbody>${rows.map((o) =>
        `<tr data-open="${o.id}"><td><div class="thumb">${frame(o)}</div></td><td class="mono">#${o.seed}</td><td class="mono">${o.size.toFixed(2)}</td><td class="mono hide-phone-col">${o.shade.toFixed(2)}</td><td>${score(o.score)}</td><td class="mono hide-phone-col">${fmtDate(o.created)}</td></tr>`).join("")}</tbody></table>`;
    } else if (S.tableLayout === "cards") {
      el.innerHTML = `<div class="cards">${rows.map((o) =>
        `<button class="card" data-open="${o.id}">${frame(o)}<span class="card__meta"><span class="mono">#${o.seed}</span>${score(o.score)}</span></button>`).join("")}</div>`;
    } else if (S.tableLayout === "split") {
      const p = S.preview;
      el.innerHTML = `<div class="split"><div class="split__list">${rows.map((o) =>
        `<button class="split__row${o === p ? " split__row--on" : ""}" data-open="${o.id}" data-preview="${o.id}"><span class="thumb" style="width:22px">${frame(o)}</span><span class="mono">#${o.seed}</span>${score(o.score)}</button>`).join("")}</div>
        <div class="split__preview">${frame(p)}<p class="mono">#${p.seed} · size ${p.size.toFixed(2)} · shade ${p.shade.toFixed(2)}</p></div></div>`;
    } else {
      el.innerHTML = groupList().map((g) =>
        `<div class="group${S.collapsed.has(g.name) ? " group--collapsed" : ""}"><button class="group__head" data-toggle="${g.name}"><span class="group__chev">▾</span><span>${g.name}</span><span class="count mono">${g.items.length}</span></button>
        <div class="group__body">${g.items.map((o) => `<button data-open="${o.id}" title="#${o.seed}">${frame(o)}</button>`).join("")}</div></div>`).join("");
    }
  }

  // ---------- Focus ----------
  function renderFocus() {
    const f = S.focus; if (!f) return;
    const o = f.output, el = $("#focusView");
    const alt = (v, label) => (remember(v), `<button class="alt" data-focus="${v.id}" title="#${v.seed}">${frame(v)}${label ? `<span class="alt__delta mono">${label}</span>` : ""}</button>`);
    let html;
    if (S.focusLayout === "strip") {
      const alts = [-0.12, -0.06, 0.06, 0.12, -0.18, 0.18].map((d, k) => alt(vary(o, d * 0.6, -d, k), (d > 0 ? "+" : "") + d.toFixed(2)));
      html = `<div><div class="hero">${frame(o)}</div><div class="alts">${alts.join("")}</div></div>`;
    } else if (S.focusLayout === "compass") {
      html = `<div class="compass"><span style="grid-area:1/2">${alt(vary(o, 0.12, 0, 21), "size +")}</span>
        <span style="grid-area:2/1">${alt(vary(o, 0, -0.18, 22), "shade −")}</span>
        <div class="hero">${frame(o)}</div>
        <span style="grid-area:2/3">${alt(vary(o, 0, 0.18, 23), "shade +")}</span>
        <span style="grid-area:3/2">${alt(vary(o, -0.12, 0, 24), "size −")}</span></div>`;
    } else if (S.focusLayout === "inspector") {
      const alts = [0, 1, 2, 3, 4, 5, 6, 7].map((k) => alt(vary(o, (hash(k, 1, 31) - 0.5) * 0.2, (hash(k, 2, 31) - 0.5) * 0.3, 40 + k)));
      html = `<div class="inspector"><div class="hero">${frame(o)}</div><div><dl class="props">
        <dt>Seed</dt><dd class="mono">#${o.seed}</dd><dt>Size</dt><dd class="mono">${o.size.toFixed(3)}</dd>
        <dt>Shade</dt><dd class="mono">${o.shade.toFixed(3)}</dd><dt>Score</dt><dd>${score(o.score)}</dd>
        <dt>Created</dt><dd class="mono">${fmtDate(o.created)}</dd></dl>
        <p class="field-label" style="margin:18px 0 8px">Nearby</p><div class="alts" style="margin:0">${alts.join("")}</div></div></div>`;
    } else {
      const dial = (name, prop, step, k0) => `<div class="dial"><span class="dial__name">${name}</span>${[-2, -1, 0, 1, 2].map((s) =>
        s === 0 ? `<span class="alt alt--current">${frame(o)}</span>` : alt(vary(o, prop === "size" ? s * step : 0, prop === "shade" ? s * step : 0, k0 + s))).join("")}</div>`;
      html = `<div class="dials"><div class="hero" style="width:min(40vh,100%)">${frame(o)}</div>${dial("Size", "size", 0.06, 60)}${dial("Shade", "shade", 0.1, 70)}</div>`;
    }
    el.innerHTML = `<div class="focus__inner">${html}</div>`;
  }
  function openFocus(o) { S.focus = { output: o, trail: [], from: S.mode }; closeMenu(); renderFocus(); updateBar(); }
  function focusOn(o) { S.focus.trail.push(S.focus.output); S.focus.output = o; renderFocus(); updateBar(); }
  function jump(i) { const f = S.focus; f.output = f.trail[i]; f.trail = f.trail.slice(0, i); renderFocus(); updateBar(); }
  function closeFocus() { S.focus = null; updateBar(); }

  // ---------- Menu ----------
  const menu = $("#sortMenu"), sortBtn = $("#sortButton");
  function closeMenu() { menu.classList.remove("menu--open"); sortBtn.setAttribute("aria-expanded", "false"); }
  sortBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = !menu.classList.contains("menu--open");
    menu.classList.toggle("menu--open", open); sortBtn.setAttribute("aria-expanded", open);
  });

  // ---------- Events ----------
  function setSort(key) {
    S.sort = S.sort.key === key ? { key, dir: -S.sort.dir } : { key, dir: 1 };
    renderTable(); updateBar();
  }
  function collapseAll() {
    const names = groupList().map((g) => g.name);
    const all = names.every((n) => S.collapsed.has(n));
    S.collapsed = all ? new Set() : new Set(names);
    renderTable(); updateBar();
  }
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, tr[data-open]");
    if (!e.target.closest("#sortDropdown")) closeMenu();
    if (!t) return;
    if (t.classList.contains("tabs__tab")) { S.mode = t.dataset.mode; S.focus = null; updateBar(); return; }
    if (t.classList.contains("segmented__option")) {
      const seg = t.closest(".segmented").dataset.seg;
      S[seg] = t.dataset.value;
      if (seg === "canvasLayout") layoutCanvas();
      if (seg === "tableLayout" || seg === "groupBy") { if (seg === "groupBy") S.collapsed = new Set(); renderTable(); }
      if (seg === "focusLayout") renderFocus();
      updateBar(); return;
    }
    if (t.dataset.sort) { setSort(t.dataset.sort); return; }
    if (t.dataset.group) { S.groupBy = t.dataset.group; S.collapsed = new Set(); renderTable(); updateBar(); return; }
    if (t.dataset.action === "collapse-all") { collapseAll(); return; }
    if (t.dataset.action === "zoom-in") return zoomCenter(1.25);
    if (t.dataset.action === "zoom-out") return zoomCenter(0.8);
    if (t.dataset.action === "reset") { world.style.transition = "transform .35s var(--ease)"; resetCam(); setTimeout(() => (world.style.transition = ""), 380); return; }
    if (t.dataset.toggle) { const n = t.dataset.toggle; S.collapsed.has(n) ? S.collapsed.delete(n) : S.collapsed.add(n); renderTable(); updateBar(); return; }
    if (t.id === "back") return closeFocus();
    if (t.dataset.jump) return jump(+t.dataset.jump);
    if (t.dataset.focus) return focusOn(byId.get(t.dataset.focus));
    if (t.dataset.open) return openFocus(byId.get(t.dataset.open));
  });
  document.addEventListener("mouseover", (e) => {
    const r = e.target.closest("[data-preview]");
    if (r && byId.get(r.dataset.preview) !== S.preview) {
      S.preview = byId.get(r.dataset.preview);
      $$(".split__row").forEach((x) => x.classList.toggle("split__row--on", x === r));
      const p = S.preview, pv = $(".split__preview");
      if (pv) pv.innerHTML = `${frame(p)}<p class="mono">#${p.seed} · size ${p.size.toFixed(2)} · shade ${p.shade.toFixed(2)}</p>`;
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (menu.classList.contains("menu--open")) return closeMenu();
    if (S.focus) closeFocus();
  });
  let resizeT;
  addEventListener("resize", () => {
    toolbar.classList.add("toolbar--still"); updateBar();
    clearTimeout(resizeT); resizeT = setTimeout(() => toolbar.classList.remove("toolbar--still"), 100);
  });
  phone.addEventListener("change", () => { resetCam(); });

  // ---------- Init ----------
  layoutCanvas(); renderTable(); resetCam(); updateBar();
  requestAnimationFrame(() => requestAnimationFrame(() => toolbar.classList.remove("toolbar--still")));
})();
</script>
</body>
</html>
