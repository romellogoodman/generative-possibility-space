<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--muted:#6f6f6b;--surface:#fff;--line:#e2e2de;--accent:#1a1a1a;--on-accent:#fff;--hi:#2f6fed;--frame:#fcfcfb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#e5e5e5;--muted:#8f8f8b;--surface:#262625;--line:#363634;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff;--frame:#111}}
:root[data-theme=dark]{--bg:#1b1b1b;--fg:#e5e5e5;--muted:#8f8f8b;--surface:#262625;--line:#363634;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff;--frame:#111}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;font-variant-numeric:tabular-nums}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50}
.bar button{padding:7px 15px;border-radius:999px;color:var(--muted)}
.bar button.on{background:var(--accent);color:var(--on-accent)}
/* an output: a square canvas with a grey square of a given size and shade */
.frame{width:100%;aspect-ratio:1;display:grid;place-items:center;background:var(--frame);border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.sq{width:calc(var(--s)*100%);aspect-ratio:1;background:hsl(0 0% var(--l));border-radius:2px;transition:width .25s,background .25s}
.pop{animation:pop .28s ease-out}
@keyframes pop{from{opacity:.3;transform:scale(.97)}}
/* top bar: back + history trail */
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:60;pointer-events:none}
.top>*{pointer-events:auto}
.back{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.back:hover{border-color:var(--fg)}
.back kbd{font:11px ui-monospace,Menlo,monospace;color:var(--muted);margin-left:6px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.trail{display:flex;align-items:center;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:3px 8px 3px 4px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.trail[hidden]{display:none}
.trail__crumb{flex:none;width:24px;padding:2px;border-radius:5px}
.trail__crumb:hover{background:var(--line)}
.trail__crumb--cur{outline:1.5px solid var(--hi);outline-offset:-1px;cursor:default}
.trail__crumb .frame{border-radius:2px}
.trail__sep,.trail__more{flex:none;color:var(--muted);font-size:11px}
.trail__more{padding:0 4px}
.stars{letter-spacing:1px;color:var(--fg)}.stars span{color:var(--line)}
.d-0{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,6px);background:var(--accent);color:var(--on-accent);padding:7px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:70;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.hero{container-type:size;padding:64px 24px 84px;display:grid;place-items:center;min-height:0}
.hero__img{width:min(100cqw,100cqh,640px);box-shadow:0 10px 40px rgba(0,0,0,.12);border-radius:4px}
.side{border-left:1px solid var(--line);background:var(--surface);padding:20px 20px 90px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.side h3{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;justify-content:space-between}
.side h3 small{font-size:11px;text-transform:none;letter-spacing:0}
.props{display:grid;grid-template-columns:auto 1fr;gap:7px 16px}.props dt{color:var(--muted)}
.props .bar-in{display:flex;align-items:center;gap:8px}
.meter{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative;max-width:110px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alt{padding:4px;border-radius:6px;transition:background .15s}
.alt:hover,.alt.is-peek{background:var(--bg)}
.alt:hover .frame,.alt.is-peek .frame{box-shadow:inset 0 0 0 1px var(--line),0 0 0 2px var(--hi)}
.alt__sc{display:block;font-size:9px;margin-top:4px;text-align:center;letter-spacing:0}.alt__sc .stars{letter-spacing:0}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:5px 12px;font-size:12px;align-items:center}
.cmp .h{color:var(--muted);font-size:11px}.cmp .k{color:var(--muted)}
.cmp__empty{color:var(--muted);font-size:12px}
.peek .frame{width:28px}
@media(hover:none){.cmp-sec{display:none}}
@media(max-width:700px){
 .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,56%) minmax(0,1fr)}
 .hero{padding:60px 16px 12px}
 .side{border-left:0;border-top:1px solid var(--line);padding:16px 16px 90px}
 .grid{grid-template-columns:repeat(6,1fr);gap:4px}
 .props{grid-template-columns:auto 1fr auto 1fr}}
</style></head><body>
<div class="top"><button class="back" id="back" title="Back (Esc)">← Back<kbd>esc</kbd></button><nav class="trail" id="trail" aria-label="Focus history" hidden></nav></div>
<div class="stage">
 <main class="hero"><div class="hero__img" id="hero"></div></main>
 <aside class="side" aria-label="Details">
  <section><h3>Properties</h3><dl class="props" id="props"></dl></section>
  <section><h3>Alternatives <small>click to focus</small></h3><div class="grid" id="grid"></div></section>
  <section class="cmp-sec"><h3>Compare</h3><div id="cmp"></div></section>
 </aside>
</div>
<nav class="bar"><button class="on">Canvas</button><button class="">Table</button></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),r2=v=>Math.round(v*100)/100;
const SIZE=[.3,.95],SHADE=[.1,.9];
function rnd(s,k){let h=Math.imul(s|0,374761393)+Math.imul(k,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function make(seed){return{seed,size:r2(.35+rnd(seed,1)*.55),shade:r2(.15+rnd(seed,2)*.7),score:1+Math.floor(rnd(seed,3)*5),
 created:new Date(Date.UTC(2026,9,1+Math.floor(rnd(seed,4)*11),Math.floor(rnd(seed,5)*24),Math.floor(rnd(seed,6)*60)))}}
/* a nearby variation of o: new seed, size/shade nudged by ds/dl */
function vary(o,ds,dl,k){const v=make(100000+Math.floor(rnd(o.seed,50+k)*900000));
 v.size=r2(clamp(o.size+ds,SIZE[0],SIZE[1]));v.shade=r2(clamp(o.shade+dl,SHADE[0],SHADE[1]));
 v.created=new Date(o.created.getTime()+(k+1)*97e3);return v}
const lum=o=>(88-72*o.shade).toFixed(1);
function tile(o,cls){return '<div class="frame'+(cls?' '+cls:'')+'"><div class="sq" style="--s:'+o.size+';--l:'+lum(o)+'%"></div></div>'}
const fmtDate=d=>d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'});
const f2=v=>v.toFixed(2).replace(/^0/,'');
const stars=n=>'<span class="stars" aria-label="'+n+' of 5">'+'★'.repeat(n)+'<span>'+'★'.repeat(5-n)+'</span></span>';
function delta(v){const r=r2(v);return r?'<span class="d">'+(r>0?'+':'−')+f2(Math.abs(r))+'</span>':'<span class="d d-0">±0</span>'}
let cur=make(482913),trail=[],alts=[];
function focusOn(o){if(!o||o===cur)return;trail.push(cur);cur=o;render()}
function jumpTo(i){cur=trail[i];trail=trail.slice(0,i);render()}
function renderTrail(){const el=$('#trail'),N=5;el.hidden=!trail.length;if(!trail.length)return;
 const from=Math.max(0,trail.length-N);let h=from?'<span class="trail__more" title="'+from+' earlier">+'+from+'</span>':'';
 for(let i=from;i<trail.length;i++)h+='<button class="trail__crumb" data-j="'+i+'" title="Back to #'+trail[i].seed+'">'+tile(trail[i])+'</button><span class="trail__sep">›</span>';
 el.innerHTML=h+'<span class="trail__crumb trail__crumb--cur" title="#'+cur.seed+' (current)">'+tile(cur)+'</span>';el.scrollLeft=1e4}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}
const leave=()=>toast('Back to Canvas');
$('#back').onclick=leave;
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>toast('Back to '+b.textContent));
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();leave()}});
document.addEventListener('click',e=>{const j=e.target.closest('[data-j]');if(j)return jumpTo(+j.dataset.j);
 const k=e.target.closest('[data-k]');if(k&&!k.disabled)focusOn(alts[+k.dataset.k])});
function nearby(o){const r=[];for(let k=0;k<6;k++){const a=(k/6+rnd(o.seed,10+k)*.1)*2*Math.PI,m=.7+rnd(o.seed,20+k)*.6;
 let ds=Math.cos(a)*.15*m,dl=Math.sin(a)*.24*m;
 if(o.size+ds>SIZE[1]||o.size+ds<SIZE[0])ds=-ds;if(o.shade+dl>SHADE[1]||o.shade+dl<SHADE[0])dl=-dl;
 r.push(vary(o,ds,dl,k))}return r}
const meter=(v,[a,b])=>'<span class="meter"><i style="width:'+((v-a)/(b-a)*100).toFixed(0)+'%"></i></span>';
function compare(a){if(!a){$('#cmp').innerHTML='<p class="cmp__empty">Hover an alternative to compare it with the focused output.</p>';return}
 $('#cmp').innerHTML='<div class="cmp"><span></span><span class="h peek">'+tile(cur)+'</span><span class="h peek">'+tile(a)+'</span><span></span>'+
 '<span class="k">Seed</span><span class="mono">'+cur.seed+'</span><span class="mono">'+a.seed+'</span><span></span>'+
 '<span class="k">Size</span><span class="mono">'+f2(cur.size)+'</span><span class="mono">'+f2(a.size)+'</span><span class="mono">'+delta(a.size-cur.size)+'</span>'+
 '<span class="k">Shade</span><span class="mono">'+f2(cur.shade)+'</span><span class="mono">'+f2(a.shade)+'</span><span class="mono">'+delta(a.shade-cur.shade)+'</span>'+
 '<span class="k">Score</span><span>'+cur.score+'</span><span>'+a.score+'</span><span class="mono">'+delta(a.score-cur.score).replace(/\.00|\./,'')+'</span></div>'}
function render(){alts=nearby(cur);
 $('#hero').innerHTML=tile(cur,'pop');
 $('#props').innerHTML='<dt>Seed</dt><dd class="mono">#'+cur.seed+'</dd><dt>Size</dt><dd class="bar-in"><span class="mono">'+f2(cur.size)+'</span>'+meter(cur.size,SIZE)+'</dd>'+
  '<dt>Shade</dt><dd class="bar-in"><span class="mono">'+f2(cur.shade)+'</span>'+meter(cur.shade,SHADE)+'</dd><dt>Score</dt><dd>'+stars(cur.score)+'</dd><dt>Created</dt><dd>'+fmtDate(cur.created)+'</dd>';
 $('#grid').innerHTML=alts.map((a,k)=>'<button class="alt" data-k="'+k+'" aria-label="Focus #'+a.seed+'">'+tile(a)+'<span class="alt__sc mono">'+'★'.repeat(a.score)+'</span></button>').join('');
 document.querySelectorAll('.alt').forEach(b=>{const p=()=>compare(alts[+b.dataset.k]);b.onmouseenter=p;b.onfocus=p});
 $('#grid').onmouseleave=()=>compare(null);
 compare(null);renderTrail()}
render();
</script></body></html>
