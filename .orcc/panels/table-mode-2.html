<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--muted:#8a8a86;--sq:#9a9a96;--surface:#fff;--line:#e2e2de;--accent:#1a1a1a;--on-accent:#fff;--hi:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff}}
:root[data-theme=dark],.dark{--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.out{background:var(--sq);border-radius:2px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50}
.bar button{padding:7px 15px;border-radius:999px;color:var(--muted)}
.bar button.on{background:var(--accent);color:var(--on-accent)}
.hint{position:fixed;top:14px;left:16px;color:var(--muted);font-size:12px;z-index:50}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,6px);background:var(--accent);color:var(--on-accent);padding:7px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* B · Cards */
.wrap{position:absolute;inset:0;overflow:auto;padding:0 24px 104px}
.tools{position:sticky;top:0;z-index:2;display:flex;gap:6px;align-items:center;padding:16px 0 12px;background:var(--bg);color:var(--muted);flex-wrap:wrap}
.tools .lab{margin-right:4px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);display:inline-flex;gap:5px;align-items:center}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip .arr{font-size:9px}
.chip:focus-visible,.card:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s;position:relative}
.card:hover{border-color:var(--muted);box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.card.sel{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi)}
.card .img{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:var(--bg)}
.card .open{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--on-accent);font-size:11px;padding:3px 8px;border-radius:999px;opacity:0;transition:opacity .12s}
.card:hover .open,.card:focus-visible .open{opacity:1}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:10px 12px 12px;font-size:12px}
dt{color:var(--muted)}dd{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
dt.k,dd.k{color:var(--fg);font-weight:600}
.dots{letter-spacing:1px;font-size:10px}.dots s{text-decoration:none;opacity:.22}
@media(max-width:640px){
 .wrap{padding:0 16px 104px}
 .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:12px 16px 10px}
 .chip{flex:none;padding:5px 9px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 dl{padding:8px 10px 10px;gap:2px 8px;font-size:11px}
 .mono{font-size:11px}
 .card .open{display:none}
}
</style></head><body>
<div class="wrap"><div class="tools" id="tools"><span class="lab">Sort</span></div><div class="grid" id="g"></div></div>
<div class="toast" id="t" role="status"></div>
<nav class="bar"><button class="">Canvas</button><button class="on">Table</button></nav>
<script>
// note: gen.py's hash only ever returns values in [0,0.5) (signed shifts), so scores never pass 3; this version mixes fully
function hash(x,y,s){let h=((s||0)*2654435761+x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h=Math.imul(h^(h>>>16),2246822519);return((h^(h>>>15))>>>0)/4294967296}
function out(x,y){const seed=Math.floor(hash(x,y,7)*1e6);return{id:x+','+y,seed,size:.55+hash(x,y,1)*.35,shade:.45+hash(x,y,2)*.55,
 created:new Date(Date.UTC(2026,9,1+Math.floor(hash(x,y,3)*11),Math.floor(hash(x,y,4)*24),Math.floor(hash(x,y,5)*60))),score:Math.floor(hash(x,y,6)*5)+1}}
function sq(o,scale){scale=scale||1;return '<div class="out" style="width:'+(o.size*100*scale)+'%;height:'+(o.size*100*scale)+'%;opacity:'+o.shade+'"></div>'}
function fmtDate(d){return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'})}
const T=document.getElementById('t');let tt;
function toast(o){T.textContent='Opening #'+o.seed+' in Focus →';T.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('show'),1400)}

const rows=[];for(let i=0;i<60;i++)rows.push(out(i,i*7+3));
const KEYS=[['created','Created',-1],['score','Score',-1],['size','Size',-1],['shade','Shade',-1],['seed','Seed',1]];
let key='created',dir=-1,sel=null;
const tools=document.getElementById('tools'),g=document.getElementById('g');
KEYS.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.innerHTML=l+'<span class="arr"></span>';tools.appendChild(b)});
tools.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const k=b.dataset.k;if(k===key)dir*=-1;else{key=k;dir=KEYS.find(x=>x[0]===k)[2]}draw()};
function row(o,k,l,v){return '<dt'+(k===key?' class="k"':'')+'>'+l+'</dt><dd'+(k===key?' class="k"':'')+'>'+v+'</dd>'}
function draw(){
 rows.sort((a,b)=>((a[key]>b[key])-(a[key]<b[key]))*dir||a.seed-b.seed);
 tools.querySelectorAll('.chip').forEach(b=>{const on=b.dataset.k===key;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.querySelector('.arr').textContent=on?(dir>0?'▲':'▼'):''});
 g.innerHTML=rows.map(o=>'<div class="card'+(o.id===sel?' sel':'')+'" tabindex="0" role="button" data-id="'+o.id+'" aria-label="Output #'+o.seed+'"><div class="img">'+sq(o,.85)+'</div><span class="open">Open →</span><dl>'+
  row(o,'seed','Seed','<span class="mono">#'+o.seed+'</span>')+
  row(o,'size','Size','<span class="mono">'+o.size.toFixed(2)+'</span>')+
  row(o,'shade','Shade','<span class="mono">'+o.shade.toFixed(2)+'</span>')+
  row(o,'score','Score','<span class="dots" aria-label="'+o.score+' of 5">'+'●'.repeat(o.score)+'<s>'+'●'.repeat(5-o.score)+'</s></span>')+
  row(o,'created','Created',fmtDate(o.created))+'</dl></div>').join('')}
function open(c){if(!c)return;sel=c.dataset.id;g.querySelectorAll('.card.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');toast(rows.find(o=>o.id===sel))}
g.onclick=e=>open(e.target.closest('.card'));
g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.card');if(c){e.preventDefault();open(c)}}};
draw();
</script></body></html>
