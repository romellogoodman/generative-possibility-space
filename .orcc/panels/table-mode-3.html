<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--muted:#8a8a86;--sq:#9a9a96;--surface:#fff;--line:#e2e2de;--accent:#1a1a1a;--on-accent:#fff;--hi:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff}}
:root[data-theme=dark],.dark{--bg:#1b1b1b;--fg:#e5e5e5;--muted:#7b7b78;--sq:#8a8a86;--surface:#262625;--line:#333331;--accent:#e5e5e5;--on-accent:#1b1b1b;--hi:#6f9bff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.out{background:var(--sq);border-radius:2px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50}
.bar button{padding:7px 15px;border-radius:999px;color:var(--muted)}
.bar button.on{background:var(--accent);color:var(--on-accent)}
.hint{position:fixed;top:14px;left:16px;color:var(--muted);font-size:12px;z-index:50}
.toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,6px);background:var(--accent);color:var(--on-accent);padding:7px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* C · Split preview */
.split{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,40%)}
.list{overflow:auto;padding:0 0 104px 16px;scroll-padding:44px 0 104px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;background:var(--bg);text-align:left;font-weight:500;color:var(--muted);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{display:flex;gap:4px;align-items:center;width:100%;padding:16px 12px 8px;color:inherit;text-align:inherit}
th.num button{justify-content:flex-end}
th button:hover,th[aria-sort] button{color:var(--fg)}
th button:focus-visible{outline:2px solid var(--hi);outline-offset:-2px;border-radius:4px}
.arr{font-size:9px;width:8px;display:inline-block}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.num{text-align:right}
tbody tr{cursor:pointer}
tbody tr:focus{outline:none}
tr.sel td{background:var(--surface)}tr.sel td:first-child{box-shadow:inset 2px 0 var(--hi)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--sq);vertical-align:-1px;margin-right:8px}
.dots{letter-spacing:1px;font-size:10px}.dots s{text-decoration:none;opacity:.22}
.pv{border-left:1px solid var(--line);display:flex;flex-direction:column;padding:24px 24px 96px;gap:18px;min-height:0;background:var(--surface)}
.pv .img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;container-type:size}
.pv .img .box{width:min(100cqw,100cqh,420px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:6px;cursor:zoom-in}
.pv .meta{display:flex;flex-direction:column;gap:14px}
.pv h2{font:600 15px/1.2 ui-monospace,"SF Mono",Menlo,monospace}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}dt{color:var(--muted)}dd{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.go{background:var(--accent);color:var(--on-accent);padding:8px 16px;border-radius:999px}
.go:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.kbd{color:var(--muted);font-size:12px}
@media(max-width:640px){
 .split{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .pv{order:-1;border-left:0;border-bottom:1px solid var(--line);flex-direction:row;padding:12px 16px;gap:14px;align-items:center}
 .pv .img{flex:0 0 112px;height:112px}
 .pv .img .box{width:112px}
 .pv .meta{flex:1;min-width:0;gap:8px}
 .pv h2{font-size:13px}
 dl{gap:2px 10px;font-size:12px}
 .c-created{display:none}
 .go{padding:6px 12px;font-size:12px}
 .list{padding-left:4px}
 th button{padding:10px 8px 8px}td{padding:9px 8px}
}
</style></head><body>
<div class="split"><div class="list" id="list"><table><thead><tr><th data-k="seed"><button>Seed<span class="arr"></span></button></th><th data-k="size" class="num"><button>Size<span class="arr"></span></button></th><th data-k="shade" class="num"><button>Shade<span class="arr"></span></button></th><th data-k="score" class="num"><button>Score<span class="arr"></span></button></th><th data-k="created" class="c-created"><button>Created<span class="arr"></span></button></th></tr></thead><tbody id="tb" tabindex="0"></tbody></table></div><aside class="pv" id="pv"></aside></div>
<div class="toast" id="t" role="status"></div>
<nav class="bar"><button class="">Canvas</button><button class="on">Table</button></nav>
<script>
// note: gen.py's hash only ever returns values in [0,0.5) (signed shifts), so scores never pass 3; this version mixes fully
function hash(x,y,s){let h=((s||0)*2654435761+x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h=Math.imul(h^(h>>>16),2246822519);return((h^(h>>>15))>>>0)/4294967296}
function out(x,y){const seed=Math.floor(hash(x,y,7)*1e6);return{id:x+','+y,seed,size:.55+hash(x,y,1)*.35,shade:.45+hash(x,y,2)*.55,
 created:new Date(Date.UTC(2026,9,1+Math.floor(hash(x,y,3)*11),Math.floor(hash(x,y,4)*24),Math.floor(hash(x,y,5)*60))),score:Math.floor(hash(x,y,6)*5)+1}}
function sq(o,scale){scale=scale||1;return '<div class="out" style="width:'+(o.size*100*scale)+'%;height:'+(o.size*100*scale)+'%;opacity:'+o.shade+'"></div>'}
function fmtDate(d){return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'UTC'})}
const T=document.getElementById('t');let tt;
function toast(o){T.textContent='Opening #'+o.seed+' in Focus →';T.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('show'),1400)}

const rows=[];for(let i=0;i<60;i++)rows.push(out(i,i*7+3));
let key='created',dir=-1,sel=null;
const defDir={seed:1,size:-1,shade:-1,score:-1,created:-1};
const tb=document.getElementById('tb'),pv=document.getElementById('pv'),fine=matchMedia('(hover:hover)');
function draw(){
 rows.sort((a,b)=>((a[key]>b[key])-(a[key]<b[key]))*dir||a.seed-b.seed);
 if(sel===null)sel=rows[0].id;
 document.querySelectorAll('th[data-k]').forEach(th=>{const on=th.dataset.k===key;
  if(on)th.setAttribute('aria-sort',dir>0?'ascending':'descending');else th.removeAttribute('aria-sort');
  th.querySelector('.arr').textContent=on?(dir>0?'▲':'▼'):''});
 tb.innerHTML=rows.map(o=>'<tr data-id="'+o.id+'"'+(o.id===sel?' class="sel"':'')+'><td class="mono"><span class="sw" style="opacity:'+o.shade+'"></span>#'+o.seed+'</td><td class="mono num">'+o.size.toFixed(2)+'</td><td class="mono num">'+o.shade.toFixed(2)+'</td><td class="num"><span class="dots" aria-label="'+o.score+' of 5">'+'●'.repeat(o.score)+'<s>'+'●'.repeat(5-o.score)+'</s></span></td><td class="c-created">'+fmtDate(o.created)+'</td></tr>').join('');
 preview()}
function cur(){return rows.find(o=>o.id===sel)}
function preview(){const o=cur();
 pv.innerHTML='<div class="img"><div class="box" id="big" title="Open in Focus">'+sq(o)+'</div></div><div class="meta"><h2>#'+o.seed+'</h2><dl><dt>Size</dt><dd class="mono">'+o.size.toFixed(2)+'</dd><dt>Shade</dt><dd class="mono">'+o.shade.toFixed(2)+'</dd><dt>Score</dt><dd>'+o.score+' / 5</dd><dt>Created</dt><dd>'+fmtDate(o.created)+'</dd></dl><div class="row"><button class="go" id="go">Open in Focus</button><span class="kbd">'+(fine.matches?'↑ ↓ to move · Enter to open':'or tap the row again')+'</span></div></div>'}
function select(id,scroll){if(id===sel)return;sel=id;
 tb.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel'));
 const tr=tb.querySelector('tr[data-id="'+id+'"]');tr.classList.add('sel');if(scroll)tr.scrollIntoView({block:'nearest'});preview()}
tb.onmouseover=e=>{if(!fine.matches)return;const tr=e.target.closest('tr');if(tr)select(tr.dataset.id)};
// touch: first tap previews, second tap (or the button) opens
tb.onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;if(!fine.matches&&tr.dataset.id!==sel){select(tr.dataset.id);return}select(tr.dataset.id);toast(cur())};
pv.onclick=e=>{if(e.target.closest('#go,#big'))toast(cur())};
document.querySelectorAll('th[data-k] button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k;if(key===k)dir*=-1;else{key=k;dir=defDir[k]}draw()});
addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('button'))return;const i=rows.findIndex(o=>o.id===sel);
 if(e.key==='ArrowDown')select(rows[Math.min(rows.length-1,i+1)].id,1);
 else if(e.key==='ArrowUp')select(rows[Math.max(0,i-1)].id,1);
 else if(e.key==='Enter')toast(cur());
 else return;e.preventDefault()});
draw();
</script></body></html>
